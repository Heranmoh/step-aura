<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Step Aura</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
    }

    /* Navbar */
    header {
      background: #111;
      color: white;
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    header h1 {
      font-size: 22px;
      letter-spacing: 2px;
    }

    nav a {
      color: white;
      margin-left: 20px;
      text-decoration: none;
      font-size: 14px;
    }

    nav a:hover {
      color: #00c2ff;
    }

    /* Hero */
    .hero {
      height: 60vh;
      background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1528701800489-20be3c7b6c0f') center/cover;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .hero h2 {
      font-size: 40px;
    }

    .hero p {
      margin-top: 10px;
      font-size: 18px;
    }

    /* Products */
    .products {
      padding: 40px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .price {
      color: green;
      font-weight: bold;
      margin: 5px 0;
    }

    button {
      width: 100%;
      padding: 10px;
      background: black;
      color: white;
      border: none;
      cursor: pointer;
      margin-top: 10px;
      border-radius: 6px;
    }

    button:hover {
      background: #00c2ff;
    }

    /* Contact */
    .contact {
      background: #111;
      color: white;
      padding: 40px;
      text-align: center;
    }

    .contact p {
      margin: 10px 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Step Aura</h1>
  <nav>
    <a href="#home">Home</a>
    <a href="#products">Products</a>
    <a href="#contact">Contact</a>
  </nav>
</header>

<section class="hero" id="home">
  <div>
    <h2>Step Aura Sneakers</h2>
    <p>Clean. Minimal. Premium Style.</p>
  </div>
</section>

<section class="products" id="products">

  <div class="card">
    <img src="/mnt/data/shoe 1.jpg" alt="shoe1" />
    <div class="card-content">
      <h3>ZARA White Sneaker</h3>
      <p class="price">12,000 ETB</p>
      <button onclick="order('ZARA White Sneaker')">Order Now</button>
    </div>
  </div>

  <div class="card">
    <img src="/mnt/data/shoe2.jpg" alt="shoe2" />
    <div class="card-content">
      <h3>Calvin Klein Sneaker</h3>
      <p class="price">12,000 ETB</p>
      <button onclick="order('Calvin Klein Sneaker')">Order Now</button>
    </div>
  </div>

  <div class="card">
    <img src="/mnt/data/shoe16.jpg" alt="shoe3" />
    <div class="card-content">
      <h3>ON Running Sport Shoe</h3>
      <p class="price">12,000 ETB</p>
      <button onclick="order('ON Running Sport Shoe')">Order Now</button>
    </div>
  </div>

</section>

<section class="contact" id="contact">
  <h2>Contact Us</h2>
  <p>📞 0924029522</p>
  <p>📩 Telegram: @heranmoh</p>
</section>

<script>
  function order(product) {
    alert("You selected: " + product + "\nContact us on Telegram @heranmoh or call 0924029522");
  }
</script>

</body>
</html>
